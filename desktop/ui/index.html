<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>HBS Console</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="rail" aria-hidden="true"></div>

  <main class="shell">
    <header class="topbar">
      <img class="mark" src="icon.png" alt="" width="32" height="32" />
      <div class="wordmark">
        <span class="name">HBS Console</span>
        <span class="kicker">host baseline security reviews</span>
      </div>
      <span class="topbar-meta" id="metaVersion">…</span>
    </header>

    <!--
      Fallback surface only. The app opens the dashboard itself; this page is
      what remains if the engine cannot start. Start/stop/restart/logs live in
      the tray menu and the `hbs` command, not here.
    -->
    <section class="status" aria-live="polite">
      <div class="status-main">
        <span class="led" id="dot" data-state="unknown" aria-hidden="true"></span>
        <div class="status-copy">
          <strong id="statusLabel">Starting the dashboard…</strong>
          <span class="addr" id="statusDetail">probing the local engine</span>
        </div>
      </div>
      <div class="status-actions">
        <button class="btn btn-primary" id="btnRetry">Retry</button>
        <button class="btn" id="btnBrowser">Open in browser</button>
      </div>
    </section>

    <p class="alert" id="note" role="alert" hidden></p>

    <nav class="links" aria-label="Support actions">
      <button class="link" id="btnLogs">View logs</button>
      <button class="link" id="btnData">Open data folder</button>
      <button class="link" id="btnQuit">Quit HBS</button>
    </nav>

    <footer class="meta">
      <span id="metaRoot"></span>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
