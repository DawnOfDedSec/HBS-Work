[package]
name = "hbs-desktop"
version = "0.1.0"
description = "HBS Console - host baseline security reviews, from your tray"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Engine self-provisioning: fetch the standalone server from the release,
# verify its SHA-256 and unpack it. Platform TLS (schannel / Security.framework
# / OpenSSL) keeps the build free of a vendored C crypto toolchain.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "default-tls", "json"] }
flate2 = "1"
sha2 = "0.10"
hex = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
