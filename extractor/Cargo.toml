[package]
name = "hbs-extractor"
version = "0.1.0"
edition = "2021"

[lib]
name = "hbs_extractor"
path = "src/lib.rs"

[[bin]]
name = "hbs-extractor"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zstd = "0.13"
x25519-dalek = { version = "2", features = ["static_secrets"] }
rand_core = { version = "0.6", features = ["getrandom"] }
hkdf = "0.12"
sha2 = "0.10"
chacha20poly1305 = "0.10"
aes-gcm = "0.10"
getrandom = "0.2"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"
console = "0.15"
obfstr = "0.4"
anyhow = "1"
ureq = { version = "2", features = ["tls"] }
libc = "0.2"
wait-timeout = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation", "Win32_NetworkManagement_NetManagement", "Win32_Security", "Win32_Security_Authentication_Identity",
  "Win32_Security_Authorization",
  "Win32_System_Registry",
  "Win32_System_SystemInformation", "Win32_System_Threading",
  "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_ProcessStatus",
  "Wdk_System_SystemServices" ] }

[dev-dependencies]
sha2 = "0.10"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
opt-level = "z"
