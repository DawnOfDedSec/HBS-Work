name: release

# Runs only after `validate` succeeds on main (or manually). Builds every
# target in parallel, then creates the GitHub Release for the version in
# extractor/Cargo.toml - or, if that release already exists, overwrites the
# assets and APPENDS the new changelog.

on:
  workflow_run:
    workflows: [validate]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

# Serialize releases; never cancel one mid-publish.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.target }})
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl,      os: ubuntu-24.04,  experimental: false }
          - { target: aarch64-unknown-linux-musl,     os: ubuntu-24.04,  experimental: false }
          - { target: armv7-unknown-linux-musleabihf, os: ubuntu-24.04,  experimental: true }
          - { target: x86_64-pc-windows-msvc,         os: windows-2022,  experimental: false }
          - { target: aarch64-pc-windows-msvc,        os: windows-11-arm, experimental: true }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    continue-on-error: ${{ matrix.experimental }}
    defaults:
      run:
        working-directory: extractor
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: extractor
          prefix-key: release-${{ matrix.target }}

      # Prebuilt cargo-zigbuild from GitHub Releases (checksummed) + the zig
      # toolchain via the prebuilt ziglang wheel. cargo-zigbuild does not
      # bundle zig; it discovers it through `python3 -m ziglang`.
      # (--break-system-packages: ubuntu-24.04 marks python as externally
      # managed; the flag is supported by its bundled pip.)
      - name: Install zig (ziglang wheel)
        if: runner.os == 'Linux'
        run: |
          pip3 install --break-system-packages ziglang
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install cargo-zigbuild
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')" >> "$GITHUB_OUTPUT"

      - name: Build release (Linux musl)
        if: runner.os == 'Linux'
        run: cargo zigbuild --release --target ${{ matrix.target }}

      - name: Build release (Windows, static CRT)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:RUSTFLAGS = "-C target-feature=+crt-static"
          cargo build --release --target ${{ matrix.target }}

      - name: Package binary
        shell: bash
        run: |
          set -e
          EXT=""
          case "${{ matrix.target }}" in *windows*) EXT=".exe";; esac
          SRC="target/${{ matrix.target }}/release/hbs-extractor${EXT}"
          NAME="hbs-extractor-${{ steps.ver.outputs.version }}-${{ matrix.target }}${EXT}"
          mkdir -p "$GITHUB_WORKSPACE/release-assets"
          cp "$SRC" "$GITHUB_WORKSPACE/release-assets/$NAME"
          (cd "$GITHUB_WORKSPACE/release-assets" && sha256sum "$NAME" > "$NAME.sha256")
          ls -l "$GITHUB_WORKSPACE/release-assets"

      - uses: actions/upload-artifact@v4
        with:
          name: asset-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error

  server-bundle:
    name: server (${{ matrix.target }})
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    strategy:
      fail-fast: false
      matrix:
        # Standalone dashboard servers: Bun runtime + built SPA embedded in one
        # executable, cross-compiled for every supported OS/arch. These are what
        # the installers download - end users never install Bun or Node.
        include:
          - { target: bun-linux-x64,        os: ubuntu-24.04 }
          - { target: bun-linux-arm64,      os: ubuntu-24.04 }
          - { target: bun-linux-x64-musl,   os: ubuntu-24.04 }
          - { target: bun-linux-arm64-musl, os: ubuntu-24.04 }
          - { target: bun-darwin-x64,       os: macos-latest }
          - { target: bun-darwin-arm64,     os: macos-latest }
          - { target: bun-windows-x64,      os: windows-2022 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Read version
        id: ver
        shell: bash
        run: |
          VERSION="$(grep -m1 '^version' ../extractor/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build the SPA + embedded asset bundle
        run: bun run build
      - name: Compile the standalone server
        # bash on every runner: the Windows job would otherwise run this
        # backslash-continued, $VAR-quoted script under PowerShell.
        shell: bash
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          bun x --bun bun build --compile --minify --sourcemap=none \
            --target ${{ matrix.target }} \
            --outfile "hbs-server-$VERSION-${{ matrix.target }}" server/index.ts
      - name: Package (gzip; installers decompress natively)
        shell: bash
        run: |
          set -e
          VERSION="${{ steps.ver.outputs.version }}"
          # Bun appends .exe on Windows, but the ASSET name must not: install.ps1
          # (and the desktop shell) look for hbs-server-<version>-<target>.gz on
          # every platform. Only the source path carries the .exe.
          NAME="hbs-server-$VERSION-${{ matrix.target }}"
          SRC="$NAME"
          case "${{ matrix.target }}" in *windows*) SRC="$NAME.exe";; esac
          mkdir -p "$GITHUB_WORKSPACE/release-assets"
          gzip -9 -c "$SRC" > "$GITHUB_WORKSPACE/release-assets/$NAME.gz"
          ls -l "$GITHUB_WORKSPACE/release-assets"
      - uses: actions/upload-artifact@v4
        with:
          name: asset-server-${{ matrix.target }}
          path: ${{ github.workspace }}/release-assets/*
          if-no-files-found: error

  dashboard-bundle:
    name: build (dashboard bundle)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Package dist
        run: tar -czf "$GITHUB_WORKSPACE/hbs-dashboard-dist.tar.gz" -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: asset-dashboard
          path: hbs-dashboard-dist.tar.gz
          if-no-files-found: error

  desktop-bundles:
    name: desktop app (${{ matrix.name }})
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux,       os: ubuntu-24.04,      targets: "",                         experimental: false }
          # arm64 deb/rpm is opportunistic: a missing arm runner must not block
          # a release that every other platform needs.
          - { name: linux-arm64, os: ubuntu-24.04-arm,  targets: "deb,rpm",                  experimental: true }
          - { name: windows,     os: windows-2022,      targets: "",                         experimental: false }
          - { name: macos,       os: macos-latest,      targets: "",                         experimental: false }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    continue-on-error: ${{ matrix.experimental }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
          prefix-key: desktop-${{ matrix.name }}

      - name: Linux bundling dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libgtk-3-dev libssl-dev rpm file

      - name: Sync version from the extractor
        shell: bash
        run: |
          set -e
          VERSION="$(grep -m1 '^version' ../extractor/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          sed -i.bak -E "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml && rm -f Cargo.toml.bak
          python3 - "$VERSION" <<'PY'
          import json, sys
          version = sys.argv[1]
          with open("tauri.conf.json") as fh:
              conf = json.load(fh)
          conf["version"] = version
          with open("tauri.conf.json", "w") as fh:
              json.dump(conf, fh, indent=2)
              fh.write("\n")
          PY
          echo "desktop app version: $VERSION"

      - name: Add the second macOS target (universal build)
        if: matrix.name == 'macos'
        shell: bash
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Build the desktop app bundles
        # bash on every runner: the version/target logic below is shell script,
        # and PowerShell does not parse $VAR assignments or backslash breaks.
        shell: bash
        run: |
          ARGS="build"
          if [ -n "${{ matrix.targets }}" ]; then
            ARGS="$ARGS --bundles ${{ matrix.targets }}"
          fi
          if [ "${{ matrix.name }}" = "macos" ]; then
            # One universal dmg runs natively on Apple Silicon and Intel.
            ARGS="$ARGS --target universal-apple-darwin"
          fi
          bun x --bun "@tauri-apps/cli@^2" $ARGS

      - name: Collect bundles
        shell: bash
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/release-assets"
          # Search all of target: a --target build (the macOS universal dmg)
          # lands in target/<triple>/release/bundle, not target/release/bundle.
          # Restrict to bundle directories and to installer extensions, or the
          # scan also sweeps up target/release/build/*/build-script-build.exe
          # and the raw unbundled binaries.
          # Spaces become dots: GitHub sanitizes release asset names that way,
          # so the manifest and SHA256SUMS must use the name the asset will
          # actually have ("HBS Console_..." -> "HBS.Console_...").
          find target -maxdepth 6 -type f -path '*/release/bundle/*' \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \
               -o -name '*.dmg' -o -name '*.msi' -o -name '*-setup.exe' \) \
            -exec sh -c 'for f do cp "$f" "$GITHUB_WORKSPACE/release-assets/$(basename "$f" | tr " " ".")"; done' sh {} +
          ls -l "$GITHUB_WORKSPACE/release-assets"

      - uses: actions/upload-artifact@v4
        with:
          name: asset-desktop-${{ matrix.name }}
          path: release-assets/*
          if-no-files-found: error

  release:
    name: publish release
    needs: [build, server-bundle, dashboard-bundle, desktop-bundles]
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main')) &&
      needs.build.result == 'success' &&
      needs.server-bundle.result == 'success' &&
      needs.dashboard-bundle.result == 'success' &&
      needs.desktop-bundles.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: asset-*
          merge-multiple: true
          path: release-assets

      - name: Determine version and changelog
        id: changelog
        run: |
          set -e
          VERSION="$(grep -m1 '^version' extractor/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          TAG="v$VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # Previous tag = the tag of the existing release, or latest tag.
          PREV="$(git tag --sort=-creatordate | grep -m1 -E '^v[0-9]' || true)"
          if [ -n "$PREV" ]; then RANGE="$PREV..HEAD"; else RANGE="HEAD"; fi
          {
            echo "## Changes"
            echo
            git log --no-merges --pretty=format:'- %s (%h)' "$RANGE" | head -n 200
            echo
            echo
            echo "_Commit: \`${{ github.sha }}\`_"
          } > notes.md
          cat notes.md

      - name: Checksums and manifest
        env:
          VERSION: ${{ steps.changelog.outputs.version }}
        run: |
          set -e
          cd release-assets
          rm -f SHA256SUMS manifest.json
          sha256sum * > SHA256SUMS
          python3 - <<'PY'
          import hashlib, json, os

          files = sorted(
              f for f in os.listdir(".")
              if f not in ("SHA256SUMS", "manifest.json")
          )
          manifest = {
              "version": os.environ["VERSION"],
              "commit": os.environ["GITHUB_SHA"],
              "files": [
                  {
                      "name": f,
                      "sha256": hashlib.sha256(open(f, "rb").read()).hexdigest(),
                      "bytes": os.path.getsize(f),
                  }
                  for f in files
              ],
          }
          with open("manifest.json", "w") as fh:
              json.dump(manifest, fh, indent=2)
              fh.write("\n")
          PY
          cat manifest.json

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${{ steps.changelog.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists -> replace assets and append changelog"
            gh release view "$TAG" --json body -q .body > existing.md || true
            { cat existing.md; echo; echo "---"; echo; cat notes.md; } > combined.md
            gh release edit "$TAG" --notes-file combined.md
            # Replace, not merge: --clobber alone would leave a renamed or
            # dropped artifact behind as a stale download. Delete the old set
            # first, then upload the fresh one.
            gh release view "$TAG" --json assets --jq '.assets[].name' | while IFS= read -r name; do
              if [ -n "$name" ]; then
                gh release delete-asset "$TAG" "$name" --yes
              fi
            done
            gh release upload "$TAG" release-assets/* --clobber
          else
            echo "creating release $TAG"
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file notes.md \
              release-assets/*
          fi
