name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Fail fast, never hang: superseded runs (new push on the same branch/PR) are
# cancelled immediately, and every job carries timeout-minutes so a wedged
# job can never burn hours of queue/execute time again.
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

# Job graph:
#   changes   -> path filter (skip heavy jobs for README/docs-only edits)
#   checks    -> rustfmt + clippy (informational, non-blocking)
#   windows   -> extractor build + tests + sealed smoke scan (2022, 2025)
#   linux     -> extractor build + tests inside real distro containers
#   dashboard -> bun test + tsc + vite build
#   docs      -> docs site build (vite + prerender)
#   summary   -> single green/red gate (make THIS the required check)
jobs:
  changes:
    name: detect changed paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      extractor: ${{ steps.filter.outputs.extractor }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
      docs: ${{ steps.filter.outputs.docs }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            extractor:
              - 'extractor/**'
              - 'fixtures/**'
            dashboard:
              - 'dashboard/**'
            docs:
              - 'docs/**'
            workflows:
              - '.github/workflows/**'

  checks:
    name: lints (fmt + clippy)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: changes
    # informational: failures here do not block the summary gate
    continue-on-error: true
    if: >-
      needs.changes.outputs.extractor == 'true' ||
      needs.changes.outputs.workflows == 'true' ||
      github.event_name != 'pull_request'
    defaults:
      run:
        working-directory: extractor
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: extractor
      - run: cargo fmt --all -- --check
      # informational: warnings are reported but not gating (first clippy run
      # on an existing codebase would otherwise always be red)
      - run: cargo clippy --all-targets

  windows:
    name: extractor (windows, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    needs: changes
    if: >-
      needs.changes.outputs.extractor == 'true' ||
      needs.changes.outputs.workflows == 'true' ||
      github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    defaults:
      run:
        working-directory: extractor
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: extractor
      - run: cargo build
      - run: cargo test -- --skip generate_and_verify_vectors
      - name: Smoke scan (read-only, sealed report)
        shell: pwsh
        run: |
          $devkey = "ab" * 32
          $out = "smoke-${{ matrix.os }}.hbs"
          ./target/debug/hbs-extractor.exe --no-elevate --no-pause --quiet `
            --dev-insecure-key $devkey --out $out
          # ASCII-decode the magic instead of comparing byte arrays:
          # PowerShell's -ne on arrays FILTERS rather than compares, which
          # made the old check fail even on perfectly valid reports.
          # ReadAllBytes works on both Windows PowerShell 5.1 and pwsh 7
          # (unlike Get-Content -AsByteStream, which is pwsh-only).
          $bytes = [IO.File]::ReadAllBytes((Resolve-Path $out).Path)
          $magic = [Text.Encoding]::ASCII.GetString($bytes, 0, 4)
          if ($magic -cne 'HBS2') { throw "not HBS2: got '$magic'" }
          Get-Item $out | Select-Object Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.os }}
          path: extractor/smoke-${{ matrix.os }}.hbs
          if-no-files-found: error

  linux:
    name: extractor (${{ matrix.container }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: changes
    if: >-
      needs.changes.outputs.extractor == 'true' ||
      needs.changes.outputs.workflows == 'true' ||
      github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        # glibc-family distro containers (musl/alpine excluded: the actions
        # runner cannot execute inside musl containers). Coverage goal: deb
        # family + rhel family + rolling, mirroring the local docker sweep.
        container: ["debian:12", "rockylinux:9", "ubuntu:24.04"]
    container:
      image: ${{ matrix.container }}
    defaults:
      run:
        working-directory: extractor
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust (rustup, stable, minimal profile)
        shell: bash
        env:
          # GH containers set HOME=/github/home while the euid home is /root;
          # rustup refuses that combination ("you may be using sudo"). Pin the
          # toolchain locations explicitly so later steps resolve them
          # regardless of HOME.
          RUSTUP_HOME: /github/home/.rustup
          CARGO_HOME: /github/home/.cargo
        run: |
          set -e
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends curl ca-certificates build-essential
          elif command -v dnf >/dev/null 2>&1; then
            # --allowerasing: rocky:9 ships curl-minimal which conflicts with
            # full curl; make is needed alongside gcc for the build env.
            dnf install -y -q --allowerasing curl ca-certificates gcc make
          elif command -v apk >/dev/null 2>&1; then
            apk add --no-cache curl ca-certificates gcc musl-dev
          fi
          export HOME="$(getent passwd "$(id -u)" | cut -d: -f6)"
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
            sh -s -- -y --default-toolchain stable --profile minimal --no-modify-path
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          echo "RUSTUP_HOME=$RUSTUP_HOME" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$CARGO_HOME" >> "$GITHUB_ENV"
      - run: cargo build
      - run: cargo test -- --skip generate_and_verify_vectors

  dashboard:
    name: dashboard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: changes
    if: >-
      needs.changes.outputs.dashboard == 'true' ||
      needs.changes.outputs.workflows == 'true' ||
      github.event_name != 'pull_request'
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bunx tsc --noEmit
      - run: bun run build

  docs:
    name: docs build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: changes
    if: >-
      needs.changes.outputs.docs == 'true' ||
      needs.changes.outputs.workflows == 'true' ||
      github.event_name != 'pull_request'
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build

  summary:
    name: CI summary
    needs: [checks, windows, linux, dashboard, docs]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Aggregate results (lints excluded - informational)
        run: |
          echo "checks(lints): ${{ needs.checks.result }}"
          echo "windows:       ${{ needs.windows.result }}"
          echo "linux:         ${{ needs.linux.result }}"
          echo "dashboard:     ${{ needs.dashboard.result }}"
          echo "docs:          ${{ needs.docs.result }}"
          failed=0
          for r in "${{ needs.windows.result }}" "${{ needs.linux.result }}" \
                   "${{ needs.dashboard.result }}" "${{ needs.docs.result }}"; do
            [ "$r" = "failure" ] && failed=1
          done
          if [ "$failed" -ne 0 ]; then
            echo "one or more required jobs failed"
            exit 1
          fi
          echo "all required jobs green"
