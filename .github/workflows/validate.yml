name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Multi-variant validation.
#
#   Linux:   GitHub Actions (ubuntu-22.04 / 24.04) — build, tests, sealed scan.
#   Windows: GitHub Actions (windows-2019 / 2022 / 2025, plus arm64 preview) —
#            the extractor runs NATIVELY on real Windows Server variants.
#   Windows containers (Server Core LTSC) additionally run locally through the
#   Docker Windows engine: scripts/docker-e2e-hosts-windows.ts.

jobs:
  extractor-linux:
    name: extractor (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    defaults:
      run:
        working-directory: extractor
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build
      - run: cargo test -- --skip generate_and_verify_vectors
      - name: Smoke scan (read-only, sealed report)
        shell: bash
        run: |
          set -e
          DEVKEY="$(printf 'ab%.0s' {1..32})"
          OUT="smoke-${{ matrix.os }}.hbs"
          ./target/debug/hbs-extractor --no-elevate --no-pause --quiet \
            --dev-insecure-key "$DEVKEY" --out "$OUT"
          test "$(head -c 4 "$OUT")" = "HBS2"
          ls -l "$OUT"
      - uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.os }}
          path: extractor/smoke-${{ matrix.os }}.hbs
          if-no-files-found: error

  extractor-windows:
    name: extractor (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, experimental: false }
          - { os: windows-2025, experimental: false }
          - { os: windows-2019, experimental: true }  # older runner; tolerate retirement
          - { os: windows-11-arm, experimental: true } # arm64 preview
    defaults:
      run:
        working-directory: extractor
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build
      - run: cargo test -- --skip generate_and_verify_vectors
      - name: Smoke scan (read-only, sealed report)
        shell: pwsh
        run: |
          $devkey = "ab" * 32
          $out = "smoke-${{ matrix.os }}.hbs"
          ./target/debug/hbs-extractor --no-elevate --no-pause --quiet `
            --dev-insecure-key $devkey --out $out
          if ((Get-Content -AsByteStream -TotalCount 4 $out) -ne [byte[]](0x48,0x42,0x53,0x32)) { throw "not HBS2" }
          Get-Item $out | Select-Object Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.os }}
          path: extractor/smoke-${{ matrix.os }}.hbs
          if-no-files-found: error

  dashboard:
    name: dashboard
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bunx tsc --noEmit
      - run: bun run build
