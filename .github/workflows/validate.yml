name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Multi-variant validation.
#
#   Linux:  GitHub Actions matrix (real runners, no local Docker).
#   Windows: run locally through the Docker WINDOWS engine —
#            scripts/docker-e2e-hosts-windows.ts  (Server Core 2019/2022/2025).
#            GitHub-hosted Windows runners cannot run Windows containers, so the
#            Windows matrix is not duplicated here.

jobs:
  extractor-linux:
    name: extractor (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    defaults:
      run:
        working-directory: extractor
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build
      - name: Test
        run: cargo test -- --skip generate_and_verify_vectors
      - name: Smoke scan (read-only, sealed report)
        shell: bash
        run: |
          set -e
          DEVKEY="$(printf 'ab%.0s' {1..32})"
          OUT="smoke-${{ matrix.os }}.hbs"
          ./target/debug/hbs-extractor --no-elevate --no-pause --quiet \
            --dev-insecure-key "$DEVKEY" --out "$OUT"
          test "$(head -c 4 "$OUT")" = "HBS2"
          ls -l "$OUT"
      - uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.os }}
          path: extractor/smoke-${{ matrix.os }}.hbs
          if-no-files-found: error

  dashboard:
    name: dashboard
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bunx tsc --noEmit
      - run: bun run build
